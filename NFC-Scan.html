<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc & Phân Tích Thẻ NFC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px 15px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 450px;
            margin: 0 auto;
        }
        button.scan-btn {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        /* Style cho hệ thống Tabs */
        .tab-buttons {
            display: flex;
            background: #e5e5ea;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tab-content {
            display: none;
            text-align: left;
        }
        .tab-content.active {
            display: block;
        }
        /* Style nội dung hiển thị */
        .result-box {
            background: #f2f2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .label {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 4px;
        }
        .val-hex {
            font-family: monospace;
            font-size: 16px;
            color: #333;
        }
        .val-dec {
            font-size: 28px;
            font-weight: bold;
            color: #34c759;
            margin-top: 4px;
        }
        pre {
            background: #1c1c1e;
            color: #00ff66;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>BỘ ĐỌC THẺ NFC</h2>
        <button class="scan-btn" id="scanBtn"> Bắt Đầu Quét</button>

        <!-- Thanh chuyển Tab -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('tab-convert')">Chuyển Đổi Mã</button>
            <button class="tab-btn" onclick="switchTab('tab-raw')">Chi Tiết Raw Data</button>
        </div>

        <!-- TAB 1: Chuyển đổi mã -->
        <div id="tab-convert" class="tab-content active">
            <div class="result-box">
                <div class="label">Mã Hex gốc (MSB):</div>
                <div class="val-hex" id="hexRaw">Chưa quét</div>
            </div>

            <div class="result-box">
                <div class="label">Mã DEC đảo ngược (Little-Endian):</div>
                <div class="val-dec" id="decResult">0</div>
            </div>
        </div>

        <!-- TAB 2: Chi tiết tất cả dữ liệu NFC -->
        <div id="tab-raw" class="tab-content">
            <div class="result-box">
                <div class="label">Thông tin đầy đủ từ thẻ:</div>
                <pre id="rawOutput">Chấn "Bắt Đầu Quét" và chạm thẻ vào mặt lưng thiết bị để xem dữ liệu...</pre>
            </div>
        </div>
    </div>

    <script>
        // Hàm chuyển đổi tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Đọc NFC & Xử lý dữ liệu
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    document.getElementById('hexRaw').innerText = "Hãy chạm thẻ vào lưng máy...";
                    document.getElementById('rawOutput').innerText = "Đang chờ quét thẻ...";
                    
                    ndef.addEventListener("readingerror", () => {
                        alert("Không thể đọc thẻ. Vui lòng thử lại!");
                    });

                    ndef.addEventListener("reading", ({ serialNumber, message }) => {
                        // 1. XỬ LÝ CHUYỂN ĐỔI (TAB 1)
                        document.getElementById('hexRaw').innerText = serialNumber || "Không có UID";
                        
                        let decValue = 0;
                        if (serialNumber) {
                            let bytes = serialNumber.split(':');
                            let reversedHex = bytes.reverse().join('');
                            decValue = parseInt(reversedHex, 16);
                        }
                        document.getElementById('decResult').innerText = decValue;

                        // 2. XỬ LÝ DỮ LIỆU RAW CHI TIẾT (TAB 2)
                        let rawInfo = {
                            "Mã UID (Serial Number)": serialNumber || "N/A",
                            "Thời gian quét": new Date().toLocaleString("vi-VN"),
                            "Số lượng bản ghi NDEF (Records)": message.records.length,
                            "Nội dung bản ghi": []
                        };

                        // Đọc từng bản ghi NDEF nếu thẻ có chứa dữ liệu ghi sẵn
                        for (const record of message.records) {
                            let recordData = {
                                "Record Type": record.recordType,
                                "Media Type": record.mediaType || "N/A",
                                "Encoding": record.encoding || "N/A"
                            };

                            // Giải mã nội dung text/URL nếu có
                            if (record.data) {
                                const decoder = new TextDecoder(record.encoding || 'utf-8');
                                recordData["Payload Text"] = decoder.decode(record.data);
                            }
                            rawInfo["Nội dung bản ghi"].push(recordData);
                        }

                        // Hiển thị dạng JSON đẹp mắt ở Tab 2
                        document.getElementById('rawOutput').innerText = JSON.stringify(rawInfo, null, 2);
                    });
                } catch (error) {
                    alert("Lỗi cấp quyền hoặc kết nối: " + error);
                }
            } else {
                alert("Trình duyệt không hỗ trợ Web NFC. Hãy dùng Google Chrome trên Android!");
            }
        });
    </script>
</body>
</html>
